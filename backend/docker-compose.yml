version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: payroll_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payroll_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # สั่งรัน SQL สร้าง Table ตอนเริ่มแรก
      - ./Database.sql:/docker-entrypoint-initdb.d/Database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payroll_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: